[project]
name = "claude-code-shared-templates"
version = "0.1.0"
description = "A template for scientific computing projects using modern Python tooling"
authors = [
    { name = "Jörn Stöhler", email = "your-email@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core runtime dependencies - lightweight and commonly needed
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
example = "example.__main__:main"

[project.optional-dependencies]
# === Dependency Groups Explained ===
# 
# Core dependencies (always installed):
#   - Basic runtime needs: pandas, numpy, pydantic, httpx, tqdm, click, rich
#
# Optional groups (install as needed):
#   - animations: For creating mathematical animations (requires system deps: libcairo2-dev, libpango1.0-dev, ffmpeg)
#   - slides: For building presentations and course notes (matplotlib, plotly, jupyterlab)
#   - ai: For AI/ML benchmarking experiments (openai, anthropic, langchain)
#   - scientific: For advanced scientific computing (jax, numpyro, optax)
#   - web: For web applications (fastapi, uvicorn)
#   - ci: Minimal set for CI/CD pipeline (ruff, pyright, pytest) - no heavy deps needed!
#   - dev: Standard development tools (includes everything from 'ci' plus pytest-xdist, pre-commit)
#
# Installation examples:
#   make install          # Core only
#   make install-dev      # Full dev environment (recommended for developers)
#   make install-ci       # CI pipeline deps only
#   make install-animations  # Core + animation tools (needs system deps)

# For creating mathematical animations (knot theory, etc.)
animations = [
    "manim>=0.18.0",
]

# For building slides and course notes
slides = [
    "jupyterlab>=4.0.0",
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    # Note: Quarto is installed via system package manager
]

# For AI/ML benchmarking experiments
ai = [
    "openai>=1.0.0",
    "anthropic>=0.21.0",
    "langchain>=0.1.0",
]

# For advanced scientific computing
scientific = [
    "numpyro>=0.13.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "optax>=0.1.0",
    "jaxtyping>=0.2.0",
    "polars>=0.20.0",
]

# For web applications
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
]

# Minimal dependencies for CI (lint, typecheck, test)
ci = [
    "ruff>=0.1.0",
    "pyright>=1.1.350",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

# Full development environment (includes all CI tools plus extras)
dev = [
    "ruff>=0.1.0",
    "pyright>=1.1.350",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pre-commit>=3.5.0",
    # ps-monitor dependencies
    "psutil>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/example"]

# Ruff configuration - minimal rules focused on bug prevention
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from None
    "SIM105", # use contextlib.suppress
    "UP035",  # typing.Dict/List deprecation - explicit imports are clearer
    "UP006",  # Use list instead of List - typing imports are clearer  
    "UP045",  # Use X | None - Optional[X] is more explicit
    "F541",   # f-string without placeholders - useful for consistency
    "SIM108", # Use ternary operator - if-else often clearer
    "F403",   # star imports - common in mathematical libraries like Manim
    "F405",   # star import undefined names - follows from F403
    "RUF001", # ambiguous Unicode characters in strings - we do math, need Greek letters
    "RUF002", # ambiguous Unicode characters in docstrings - we do math, need Greek letters
    "I001",   # import sorting - not worth forcing refactoring
    "F401",   # unused imports - not worth forcing refactoring
]

[tool.ruff.lint.isort]
known-first-party = ["example"]

# Pyright configuration - standard mode
[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    ".git",
    "build",
    "dist",
    # Exclude animations from CI - they require optional dependencies
    "src/**/animations/**",
]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportGeneralTypeIssues = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true
reportTypedDictNotRequiredAccess = true
reportPrivateImportUsage = true
reportConstantRedefinition = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInconsistentConstructor = true
reportOverlappingOverload = true
reportUninitializedInstanceVariable = true
reportCallInDefaultInitializer = true
reportUnnecessaryIsInstance = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportAssertAlwaysTrue = true
reportSelfClsParameterName = true
reportUnusedClass = true
reportUnusedImport = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true
reportWildcardImportFromLibrary = true
reportOptionalSubscript = true
reportPrivateUsage = true
reportUnboundVariable = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=src/example",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage configuration
[tool.coverage.run]
source = ["src/example"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/__main__.py",
    # Exclude animations from coverage - they require optional dependencies
    "*/animations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"